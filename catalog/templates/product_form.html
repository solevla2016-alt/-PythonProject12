{% extends "base.html" %}

{% block title %}
Добавить товар
{% endblock %}

{% block content %}

<div class="col-6 mx-auto">

    <div class="card">

        <div class="card-header">
            <h3>Добавить товар</h3>
        </div>

        <div class="card-body">

            <form method="post"
                  enctype="multipart/form-data"
                  novalidate>

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit"
                        class="btn btn-primary">

                    Сохранить

                </button>

                <a href="{% url 'catalog:home' %}"
                   class="btn btn-secondary">

                    Отмена

                </a>

            </form>

            {% if form.errors %}

                <div class="alert alert-danger mt-3">

                    <strong>Обнаружены ошибки:</strong>

                    {{ form.errors }}

                </div>

                {% endif %}

        </div>

    </div>

</div>

{% endblock %}
