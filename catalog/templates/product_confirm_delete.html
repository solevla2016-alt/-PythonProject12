{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="card p-4">

        <h2>Удаление товара</h2>

        <p>
            Вы действительно хотите удалить товар
            <strong>{{ object.name }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit"
                    class="btn btn-danger">
                Удалить
            </button>

            <a href="{% url 'catalog:product_detail' object.pk %}"
               class="btn btn-secondary">
                Отмена
            </a>

        </form>

    </div>

</div>

{% endblock %}
