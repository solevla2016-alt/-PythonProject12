<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Товары категории</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .name {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .price {
            color: #2c3e50;
        }

        .empty {
            text-align: center;
            color: gray;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Товары категории</h1>

    {% if products %}
        <div class="grid">
            {% for product in products %}
                <div class="card">
                    <div class="name">{{ product.name }}</div>
                    <div class="price">
                        Цена: {{ product.price }} ₽
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="empty">В этой категории пока нет товаров</div>
    {% endif %}

</div>

</body>
</html>
