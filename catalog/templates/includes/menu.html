<!doctype html>
<html lang="ru">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
        Skystore
        {% endblock %}
    </title>

    <link rel="stylesheet"
          type="text/css"
          href="/static/css/bootstrap.min.css">

</head>

<body>

    <!-- ПОДКЛЮЧЕНИЕ МЕНЮ -->
    {% include "includes/menu.html" %}

    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">

        <h1 class="display-4">
            Skystore
        </h1>

        <p class="lead">
            Skystore - это отличный вариант хранения
            ваших плагинов и примеров кода
        </p>

    </div>

    <div class="container">

        <!-- КОНТЕНТ СТРАНИЦ -->
        {% block content %}
        {% endblock %}

        <footer class="pt-4 my-md-5 pt-md-5 border-top">

            <div class="row">

                <div class="col-12 col-md">

                    SkyStore

                    <small class="d-block mb-3 text-muted">
                        &copy; 2023
                    </small>

                </div>

            </div>

        </footer>

    </div>

<script type="text/javascript"
        src="/static/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
